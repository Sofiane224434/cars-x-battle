name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || '2222' }} -H "${{ secrets.VPS_HOST || '51.210.244.46' }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '51.210.244.46' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2222' }}
          VPS_USER: ${{ secrets.VPS_USER || 'debian' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/debian/apps/cars-x-battle' }}
          VPS_COMPOSE_PROJECT: ${{ vars.VPS_COMPOSE_PROJECT || 'cxb' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR=\"$VPS_APP_DIR\" VPS_COMPOSE_PROJECT=\"$VPS_COMPOSE_PROJECT\" bash -c 'cd \"$VPS_APP_DIR\" && git fetch origin main && git checkout main && git reset --hard origin/main && chmod +x scripts/deploy.sh && ./scripts/deploy.sh'"
